name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  deploy:
    name: 🚀 Deploy Application
    runs-on: ubuntu-latest
    # Job independiente - no necesita otros jobs

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: � Debug Info
        run: |
          echo "📁 Current directory: $(pwd)"
          echo "📂 Directory contents:"
          ls -la
          echo "🔍 Backend directory:"
          ls -la backend/ || echo "❌ Backend directory not found"
          echo "🔍 Frontend directory:"
          ls -la frontend/ || echo "❌ Frontend directory not found"

      - name: �🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # Backend Build
      - name: 🏗️ Build Backend
        working-directory: ./backend
        run: |
          echo "📦 Installing backend dependencies..."
          pnpm install --no-frozen-lockfile --prod=false
          echo "🏗️ Building backend..."
          pnpm run build
          echo "✅ Backend build completed"

      # Frontend Build
      - name: 🏗️ Build Frontend
        working-directory: ./frontend/auth-frontend
        run: |
          echo "📦 Installing frontend dependencies..."
          pnpm install --no-frozen-lockfile
          echo "🏗️ Building frontend..."
          CI=false pnpm run build
          echo "✅ Frontend build completed"
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL || 'http://localhost:3001' }}

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "📊 Build Summary:"
          echo "📅 Completed at: $(date)"
          echo "🔖 Commit: ${{ github.sha }}"
          echo "🌿 Branch: ${{ github.ref_name }}"

      - name: ✅ Deployment Complete
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🚀 Application is ready for production"
